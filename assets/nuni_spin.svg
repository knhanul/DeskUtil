<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1288 1288"
     width="256"
     height="256"
     role="img"
     aria-label="Nuni">
  <style>
    .nuni-mark {
      transform-origin: 644px 644px;
      animation: nuni-spin 2.2s linear infinite;
    }
    @keyframes nuni-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nuni-mark { animation: none; }
    }
  </style>

  <!-- 원본 viewBox(238 233 916 906)를 정사각 캔버스 중앙에 배치. 45° 회전 시 잘림 방지 -->
  <g class="nuni-mark" transform="translate(186 191)">
    <defs>
      <radialGradient id="nuniGlow" cx="50%" cy="50%" fx="50%" fy="50%" r="50%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="16%" stop-color="#F3FBFF"/>
        <stop offset="38%" stop-color="#7AD2FF"/>
        <stop offset="68%" stop-color="#1E9CFF"/>
        <stop offset="100%" stop-color="#0273F5"/>
      </radialGradient>
    </defs>

    <path fill="none"
          stroke="#0273F5"
          stroke-width="252"
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M364 1013 V686.5
             A172.5 172.5 0 0 1 709 686.5
             V853.5
             A159.5 159.5 0 0 0 1028 853.5
             V572"/>

    <circle cx="1028" cy="359" r="126"
            fill="url(#nuniGlow)"/>
  </g>
</svg>
